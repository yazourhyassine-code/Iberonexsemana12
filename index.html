<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iberonex · Informe Semanal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* =========================================================
   IBERONEX · INFORME SEMANAL
   iOS 26 Liquid Glass · Navy #1B2A4A · Gold #C49A3C
   ========================================================= */

:root {
  /* Brand */
  --navy:        #1B2A4A;
  --navy-2:      #243559;
  --navy-3:      #2f4376;
  --navy-soft:   rgba(27, 42, 74, 0.08);
  --navy-softer: rgba(27, 42, 74, 0.04);

  --gold:        #C49A3C;
  --gold-2:      #d4ad55;
  --gold-soft:   rgba(196, 154, 60, 0.12);
  --gold-softer: rgba(196, 154, 60, 0.06);

  /* Neutrals */
  --ink:         #1c1c20;
  --ink-2:       #333333;
  --ink-3:       #4f5159;
  --ink-4:       #666666;
  --ink-5:       #888888;
  --ink-6:       #b5b7bd;

  --paper:       #ffffff;
  --paper-2:     #f8f9fb;
  --paper-3:     #f1f2f6;
  --rule:        rgba(27, 42, 74, 0.08);
  --rule-2:      rgba(27, 42, 74, 0.14);

  /* Glass surfaces */
  --glass-bg:        rgba(255, 255, 255, 0.55);
  --glass-bg-strong: rgba(255, 255, 255, 0.72);
  --glass-bg-deep:   rgba(255, 255, 255, 0.42);
  --glass-border:    rgba(255, 255, 255, 0.7);
  --glass-border-2:  rgba(255, 255, 255, 0.5);
  --glass-shine:     rgba(255, 255, 255, 0.85);

  /* Priority */
  --alta-bg:    #FADBD8;
  --alta-text:  #922B21;
  --alta-ring:  rgba(146, 43, 33, 0.22);
  --media-bg:   #FCF3CF;
  --media-text: #7D6608;
  --media-ring: rgba(125, 102, 8, 0.22);
  --baja-bg:    #D5F5E3;
  --baja-text:  #1E8449;
  --baja-ring:  rgba(30, 132, 73, 0.22);

  /* Origin */
  --pdf:        #2E75B6;
  --pdf-bg:     rgba(46, 117, 182, 0.1);
  --pdf-ring:   rgba(46, 117, 182, 0.25);
  --web:        #E67E22;
  --web-bg:     rgba(230, 126, 34, 0.1);
  --web-ring:   rgba(230, 126, 34, 0.25);

  /* Typography */
  --sans: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "Helvetica", "Arial", sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", monospace;

  /* Radii (iOS-like generous) */
  --r-sm:  10px;
  --r-md:  16px;
  --r-lg:  20px;
  --r-xl:  24px;
  --r-pill: 999px;

  /* Shadows */
  --sh-glass:    0 1px 0 var(--glass-shine) inset, 0 1px 2px rgba(27, 42, 74, 0.04), 0 12px 32px -16px rgba(27, 42, 74, 0.18);
  --sh-glass-lg: 0 1px 0 var(--glass-shine) inset, 0 2px 4px rgba(27, 42, 74, 0.06), 0 24px 60px -20px rgba(27, 42, 74, 0.28);
  --sh-pop:      0 1px 0 var(--glass-shine) inset, 0 4px 8px rgba(27, 42, 74, 0.08), 0 32px 80px -24px rgba(27, 42, 74, 0.35);
  --sh-soft:     0 1px 0 rgba(255, 255, 255, 0.9) inset, 0 1px 2px rgba(27, 42, 74, 0.04);

  /* Motion */
  --ease:        cubic-bezier(0.32, 0.72, 0, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-out:    cubic-bezier(0.22, 1, 0.36, 1);
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

html, body {
  margin: 0; padding: 0;
  color: var(--ink-2);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  letter-spacing: -0.01em;
  min-height: 100%;
}

/* Pearlescent background with subtle gradient orbs */
body {
  background:
    radial-gradient(ellipse 50% 40% at 88% 8%,  rgba(196, 154, 60, 0.22), transparent 65%),
    radial-gradient(ellipse 55% 50% at 12% 18%, rgba(27, 42, 74, 0.16),  transparent 65%),
    radial-gradient(ellipse 60% 45% at 85% 80%, rgba(46, 117, 182, 0.10), transparent 70%),
    radial-gradient(ellipse 45% 35% at 18% 95%, rgba(196, 154, 60, 0.10), transparent 70%),
    linear-gradient(180deg, #f4f5fa 0%, #eaecf3 100%);
  background-attachment: fixed;
  min-height: 100vh;
}

a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; padding: 0; color: inherit; }
::selection { background: var(--gold); color: var(--navy); }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(27, 42, 74, 0.18); border-radius: var(--r-pill); border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: rgba(27, 42, 74, 0.3); background-clip: padding-box; }

/* ─────────────────────────────────────────────
   GLASS UTILITY
   ───────────────────────────────────────────── */
.glass {
  background: var(--glass-bg);
  -webkit-backdrop-filter: blur(40px) saturate(180%);
          backdrop-filter: blur(40px) saturate(180%);
  border: 1px solid var(--glass-border);
  box-shadow: var(--sh-glass);
  border-radius: var(--r-lg);
}
.glass-strong {
  background: var(--glass-bg-strong);
  -webkit-backdrop-filter: blur(40px) saturate(180%);
          backdrop-filter: blur(40px) saturate(180%);
  border: 1px solid var(--glass-border);
  box-shadow: var(--sh-glass);
  border-radius: var(--r-lg);
}

/* ─────────────────────────────────────────────
   TOP BAR
   ───────────────────────────────────────────── */
.topbar {
  position: sticky; top: 0; z-index: 60;
  display: flex; align-items: center;
  justify-content: space-between;
  gap: 24px;
  padding: 14px 28px;
  background: rgba(255, 255, 255, 0.62);
  -webkit-backdrop-filter: blur(28px) saturate(180%);
          backdrop-filter: blur(28px) saturate(180%);
  border-bottom: 1px solid rgba(27, 42, 74, 0.06);
}
.topbar-brand {
  display: flex; align-items: center; gap: 12px;
  cursor: pointer;
  padding: 4px 8px 4px 4px;
  border-radius: var(--r-md);
  transition: background 0.2s var(--ease);
}
.topbar-brand:hover { background: rgba(27, 42, 74, 0.04); }
.topbar-brand .mark {
  width: 32px; height: 32px;
  background: linear-gradient(135deg, var(--navy) 0%, var(--navy-3) 100%);
  display: grid; place-items: center;
  color: var(--gold);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: -0.02em;
  border-radius: 10px;
  box-shadow: 0 1px 0 rgba(255,255,255,0.4) inset, 0 4px 10px -4px rgba(27, 42, 74, 0.35);
}
.topbar-brand .name {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.015em;
  color: var(--navy);
}
.topbar-brand .sub {
  font-size: 12px;
  color: var(--ink-4);
  margin-left: 4px;
  padding-left: 12px;
  border-left: 1px solid var(--rule);
  font-weight: 400;
}

.topbar-search {
  position: relative;
  flex: 1;
  max-width: 360px;
}
.topbar-search input {
  width: 100%;
  height: 38px;
  border: 1px solid rgba(27, 42, 74, 0.08);
  background: rgba(255, 255, 255, 0.5);
  -webkit-backdrop-filter: blur(20px);
          backdrop-filter: blur(20px);
  padding: 0 14px 0 38px;
  font-family: var(--sans);
  font-size: 13.5px;
  color: var(--ink-2);
  outline: none;
  border-radius: var(--r-pill);
  transition: all 0.2s var(--ease);
}
.topbar-search input:focus {
  background: rgba(255, 255, 255, 0.85);
  border-color: var(--navy);
  box-shadow: 0 0 0 4px rgba(27, 42, 74, 0.1);
}
.topbar-search input::placeholder { color: var(--ink-5); }
.topbar-search .icon {
  position: absolute; left: 14px; top: 50%;
  transform: translateY(-50%);
  color: var(--ink-5);
  pointer-events: none;
}

.topbar-right { display: flex; align-items: center; gap: 12px; }

/* ─────────────────────────────────────────────
   WEEK SELECTOR — iOS segmented control
   ───────────────────────────────────────────── */
.week-seg {
  display: inline-flex;
  padding: 3px;
  background: rgba(27, 42, 74, 0.06);
  border-radius: var(--r-pill);
  position: relative;
  border: 1px solid rgba(27, 42, 74, 0.05);
}
.week-seg-btn {
  position: relative;
  padding: 7px 16px;
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: -0.005em;
  color: var(--ink-4);
  border-radius: var(--r-pill);
  cursor: pointer;
  transition: color 0.25s var(--ease);
  z-index: 1;
  display: inline-flex; flex-direction: column; align-items: center;
  line-height: 1.1;
}
.week-seg-btn .ws-sub {
  font-size: 10px;
  font-weight: 500;
  margin-top: 2px;
  color: var(--ink-5);
  letter-spacing: 0;
}
.week-seg-btn:hover { color: var(--navy); }
.week-seg-btn.is-active {
  color: #fff;
}
.week-seg-btn.is-active .ws-sub { color: rgba(255,255,255,0.75); }
.week-seg-thumb {
  position: absolute;
  top: 3px; bottom: 3px;
  background: linear-gradient(135deg, var(--navy) 0%, var(--navy-3) 100%);
  border-radius: var(--r-pill);
  z-index: 0;
  box-shadow: 0 1px 0 rgba(255,255,255,0.3) inset, 0 6px 14px -4px rgba(27, 42, 74, 0.35);
  transition: left 0.38s var(--ease-spring), width 0.38s var(--ease-spring);
}

/* ─────────────────────────────────────────────
   WEEK SELECTOR — collapsible vertical popover (Apple-style)
   ───────────────────────────────────────────── */
.week-nav { position: relative; }
.week-nav-trigger {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 7px 12px 7px 16px;
  background: rgba(27, 42, 74, 0.06);
  border: 1px solid rgba(27, 42, 74, 0.05);
  border-radius: var(--r-pill);
  cursor: pointer;
  transition: background 0.25s var(--ease), box-shadow 0.25s var(--ease);
}
.week-nav-trigger:hover { background: rgba(27, 42, 74, 0.1); }
.week-nav-trigger.is-open {
  background: linear-gradient(135deg, var(--navy) 0%, var(--navy-3) 100%);
  box-shadow: 0 1px 0 rgba(255,255,255,0.3) inset, 0 6px 14px -4px rgba(27, 42, 74, 0.35);
}
.week-nav-trigger .wnt-label {
  font-size: 12.5px; font-weight: 600; letter-spacing: -0.005em;
  color: var(--navy);
}
.week-nav-trigger .wnt-range {
  font-size: 10.5px; font-weight: 500; color: var(--ink-5);
}
.week-nav-trigger.is-open .wnt-label,
.week-nav-trigger.is-open .wnt-range { color: rgba(255,255,255,0.92); }
.week-nav-trigger .wnt-chevron {
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--ink-4);
  transform: rotate(90deg);
  transition: transform 0.3s var(--ease-spring), color 0.25s var(--ease);
}
.week-nav-trigger.is-open .wnt-chevron { color: rgba(255,255,255,0.85); transform: rotate(-90deg); }

.week-nav-panel {
  position: absolute;
  top: calc(100% + 10px);
  right: 0;
  min-width: 260px;
  max-height: 0;
  overflow: hidden;
  opacity: 0;
  transform: translateY(-6px) scale(0.98);
  transform-origin: top right;
  pointer-events: none;
  background: var(--glass-bg-strong);
  -webkit-backdrop-filter: blur(40px) saturate(180%);
          backdrop-filter: blur(40px) saturate(180%);
  border: 1px solid var(--glass-border);
  border-radius: var(--r-md);
  box-shadow: var(--sh-pop);
  padding: 6px;
  z-index: 80;
  transition: opacity 0.28s var(--ease), transform 0.28s var(--ease-spring), max-height 0.32s var(--ease);
}
.week-nav-panel.is-open {
  max-height: 420px;
  opacity: 1;
  transform: translateY(0) scale(1);
  pointer-events: auto;
  overflow-y: auto;
}
.week-nav-item {
  display: flex; align-items: center; gap: 10px;
  width: 100%;
  padding: 9px 12px;
  border-radius: 10px;
  cursor: pointer;
  transition: background 0.18s var(--ease);
  text-align: left;
}
.week-nav-item:hover { background: rgba(27, 42, 74, 0.06); }
.week-nav-item .wni-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--ink-6);
  flex-shrink: 0;
}
.week-nav-item .wni-text { display: flex; flex-direction: column; gap: 1px; }
.week-nav-item .wni-label { font-size: 13px; font-weight: 600; color: var(--ink-2); letter-spacing: -0.005em; }
.week-nav-item .wni-range { font-size: 11px; font-weight: 400; color: var(--ink-5); }
.week-nav-item.is-active { background: rgba(196, 154, 60, 0.12); }
.week-nav-item.is-active .wni-dot { background: var(--gold); box-shadow: 0 0 0 3px rgba(196, 154, 60, 0.18); }
.week-nav-item.is-active .wni-label { color: var(--navy); }

@media (max-width: 720px) {
  .week-nav-panel { right: auto; left: 0; min-width: 220px; }
}

/* ─────────────────────────────────────────────
   BACK NAVIGATION (iOS style)
   ───────────────────────────────────────────── */
.back-nav {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 6px 14px 6px 6px;
  margin-bottom: 16px;
  background: var(--glass-bg);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
          backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid var(--glass-border);
  border-radius: var(--r-pill);
  font-size: 13.5px;
  font-weight: 500;
  color: var(--navy);
  cursor: pointer;
  transition: all 0.2s var(--ease);
  box-shadow: var(--sh-soft);
}
.back-nav:hover {
  background: var(--glass-bg-strong);
  transform: translateX(-2px);
}
.back-nav .chev {
  display: inline-flex;
  width: 26px; height: 26px;
  align-items: center; justify-content: center;
  color: var(--navy);
}

/* ─────────────────────────────────────────────
   PAGE SHELL
   ───────────────────────────────────────────── */
main { min-height: calc(100vh - 60px - 64px); }

.page {
  max-width: 1240px;
  margin: 0 auto;
  padding: 36px 28px 72px;
}

.page-eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--navy);
  background: rgba(196, 154, 60, 0.14);
  padding: 6px 14px;
  border-radius: var(--r-pill);
  margin-bottom: 18px;
}
.page-eyebrow::before {
  content: "";
  width: 6px; height: 6px;
  background: var(--gold);
  border-radius: 50%;
}

.page-title {
  font-size: 44px;
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1.05;
  margin: 0 0 12px;
  color: var(--navy);
  text-wrap: balance;
}
.page-deck {
  font-size: 16px;
  line-height: 1.55;
  color: var(--ink-4);
  max-width: 68ch;
  margin: 0 0 32px;
  letter-spacing: -0.005em;
}

/* ─────────────────────────────────────────────
   LEVEL 1 — Vue d'ensemble (2 grandes cartes)
   ───────────────────────────────────────────── */
.continent-cards {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 24px;
}

.continent-card {
  position: relative;
  background: var(--glass-bg);
  -webkit-backdrop-filter: blur(40px) saturate(180%);
          backdrop-filter: blur(40px) saturate(180%);
  border: 1px solid var(--glass-border);
  border-radius: var(--r-xl);
  box-shadow: var(--sh-glass-lg);
  padding: 32px 32px 28px;
  cursor: pointer;
  overflow: hidden;
  transition: transform 0.35s var(--ease), box-shadow 0.35s var(--ease);
  display: flex; flex-direction: column;
  gap: 20px;
}
.continent-card::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.9), transparent);
  pointer-events: none;
}
.continent-card::after {
  content: "";
  position: absolute;
  inset: -2px;
  background: radial-gradient(circle at 50% 0%, rgba(196, 154, 60, 0.0) 0%, transparent 60%);
  pointer-events: none;
  transition: background 0.4s var(--ease);
  border-radius: inherit;
}
.continent-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--sh-pop);
}
.continent-card:hover::after {
  background: radial-gradient(circle at 50% 0%, rgba(196, 154, 60, 0.18) 0%, transparent 60%);
}
.continent-card:active {
  transform: translateY(-1px);
  transition-duration: 0.1s;
}

.cc-head {
  display: flex; justify-content: space-between; align-items: flex-start;
  gap: 16px;
}
.cc-tag {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-4);
}
.cc-tag .dot {
  width: 6px; height: 6px;
  background: var(--navy);
  border-radius: 50%;
}
.cc-alta-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px 6px 10px;
  background: var(--alta-bg);
  color: var(--alta-text);
  border-radius: var(--r-pill);
  border: 1px solid var(--alta-ring);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: -0.005em;
  white-space: nowrap;
}
.cc-alta-badge .pulse {
  width: 6px; height: 6px;
  background: var(--alta-text);
  border-radius: 50%;
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(1.4); }
}

.cc-title {
  font-size: 56px;
  font-weight: 700;
  letter-spacing: -0.04em;
  line-height: 0.95;
  margin: 0;
  color: var(--navy);
}

.cc-stats {
  display: flex; gap: 4px;
}
.cc-stat {
  flex: 1;
  padding: 14px 16px;
  background: rgba(27, 42, 74, 0.03);
  border-radius: var(--r-sm);
  display: flex; flex-direction: column;
}
.cc-stat .v {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--navy);
  line-height: 1;
  margin-bottom: 4px;
  font-feature-settings: "tnum";
}
.cc-stat .l {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.02em;
  color: var(--ink-5);
  text-transform: uppercase;
}

/* Brief inside continent card */
.cc-brief {
  display: flex; flex-direction: column;
  gap: 14px;
}
.cc-brief-headline {
  font-size: 15px;
  font-weight: 500;
  line-height: 1.45;
  color: var(--ink-2);
  margin: 0;
  letter-spacing: -0.005em;
  text-wrap: balance;
}
.cc-brief-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex; flex-direction: column;
  gap: 10px;
}
.cc-brief-list li {
  display: flex; gap: 10px;
  font-size: 13.5px;
  line-height: 1.5;
  color: var(--ink-3);
  letter-spacing: -0.003em;
}
.cc-brief-list li .tag {
  flex-shrink: 0;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.06em;
  padding: 2px 8px;
  border-radius: var(--r-pill);
  text-transform: uppercase;
  height: 18px;
  display: inline-flex; align-items: center;
  margin-top: 1px;
}
.cc-brief-list li .tag-alert { background: var(--alta-bg); color: var(--alta-text); }
.cc-brief-list li .tag-opp   { background: var(--baja-bg); color: var(--baja-text); }
.cc-brief-list li .tag-risk  { background: var(--media-bg); color: var(--media-text); }
.cc-brief-list li .tag-fact  { background: rgba(46, 117, 182, 0.12); color: var(--pdf); }

.cc-cta {
  display: flex; justify-content: space-between; align-items: center;
  padding-top: 18px;
  border-top: 1px solid rgba(27, 42, 74, 0.08);
}
.cc-cta-text {
  font-size: 13.5px;
  font-weight: 500;
  color: var(--navy);
  letter-spacing: -0.005em;
}
.cc-cta-arrow {
  display: grid; place-items: center;
  width: 44px; height: 44px;
  background: linear-gradient(135deg, var(--navy) 0%, var(--navy-3) 100%);
  color: var(--gold);
  border-radius: 50%;
  box-shadow: 0 1px 0 rgba(255,255,255,0.3) inset, 0 8px 16px -6px rgba(27, 42, 74, 0.4);
  transition: transform 0.3s var(--ease-spring);
}
.continent-card:hover .cc-cta-arrow { transform: translateX(4px) scale(1.05); }

/* ─────────────────────────────────────────────
   LEVEL 2 — Vue continent (liste pays)
   ───────────────────────────────────────────── */
.region-hero {
  display: flex; flex-wrap: wrap; align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 32px;
}
.region-hero-meta {

<script>
// Iberonex — Informe semanal
// Datos compartidos + bootstrap del historial de semanas.
// Cada semana se carga desde su propio archivo (data-w1.js, data-w2.js, …)
// y se registra mediante IBERONEX_addWeek({...}).

window.VEILLE_LEGEND = {
  urgency: {
    red:    { label: "Acción inmediata", short: "Inmediato",   weight: 4 },
    orange: { label: "Esta semana",      short: "Corto plazo", weight: 3 },

  },

  },
  owners: {

    "FIN_PROG": "Finanzas + Programas",
    "MKT_PROG": "Marketing + Programas",
    "MKT_FIN":  "Marketing + Finanzas",
    "MKT_OPS":  "Marketing + Operaciones",
    "MKT_DG":   "Marketing + Dirección General"
  },
  zones: {

    GEO: "Geoestratégico",
    SEC: "Seguridad"
  }
};

// Historial de semanas (la más reciente al frente del array)
window.VEILLE_WEEKS = [];

// Helper: cada archivo semanal llama a IBERONEX_addWeek({...})
window.IBERONEX_addWeek = function (week) {
  if (!week.legend) week.legend = window.VEILLE_LEGEND;
  window.VEILLE_WEEKS.push(week);
  // Ordenar descendente por weekNumber: la semana más reciente queda en índice 0
  window.VEILLE_WEEKS.sort((a, b) =>
    String(b.publishedAt || "").localeCompare(String(a.publishedAt || "")) || (b.weekNumber || 0) - (a.weekNumber || 0)
  );
  window.VEILLE_DATA = window.VEILLE_WEEKS[0];
};

<script type="text/babel">
// Componentes compartidos: iconos + helpers
const { useState, useEffect, useMemo, useRef } = React;

// ── Continent / region helpers ────────────────────────────────
function getContinent(region) {
  if (!region) return null;
  if (region.indexOf("África") === 0 || region.startsWith("Africa") || region === "Sahel") return "AFRICA";
  if (region.indexOf("América") === 0 || region.indexOf("Centroamérica") === 0 ||
      region.indexOf("America") === 0 || region.indexOf("Caribe") !== -1 ||
      region === "Andina" || region === "Cono Sur") return "LATAM";
  return null;
}

// ── Priority model (ALTA / MEDIA / BAJA) ──────────────────────
const PRIORITY_RANK = { ALTA: 0, MEDIA: 1, BAJA: 2 };

function urgencyToPriority(u) {
  // Semana 1 used urgency colors → map to priority labels
  if (u === "red") return "ALTA";
  if (u === "orange") return "MEDIA";
  return "BAJA"; // yellow + green → BAJA
}

// Split a "fact → impact" string into [info, impact]
function splitFact(fact) {
  if (!fact) return ["", ""];
  const arrow = fact.indexOf("→");
  if (arrow === -1) return [fact, ""];
  return [fact.slice(0, arrow).trim(), fact.slice(arrow + 1).trim()];
}

// "Sondeo IBERONEX" es una fuente interna y se oculta como solicitado.
function normalizeSource(src) {
  if (!src) return "";
  const s = String(src).trim();
  if (/sondeo\s*iberonex/i.test(s)) return "";
  return s;
}

// ── Unified entry extraction across week formats ──────────────
// Returns array of { country, region, title, info, impact, suggestion,
//                    priority, source, origin?, owner?, decision?, type? }
function getEntries(week, continent) {
  if (!week) return [];

  if (week.format === "tables" && week.tables) {
    const tab = continent === "AFRICA" ? week.tables.AFRICA : week.tables.LATAM;
    if (!tab) return [];
    // Cada fila puede traer `info` como texto (1 señal) o como array de viñetas.
    // En el segundo caso, cada viñeta se convierte en su propia señal; el
    // impacto/sugerencia consolidados quedan en la primera señal del país.
    const out = [];
    tab.rows.forEach((r, i) => {
      const src = normalizeSource(r.source);
      if (Array.isArray(r.info)) {
        r.info.forEach((txt, j) => {
          out.push({
            _id: continent + "-" + i + "-" + j,
            country: r.country,
            region: r.region || "",
            title: null,
            info: txt,
            points: null,
            impact: j === 0 ? r.impact : "",
            suggestion: j === 0 ? r.suggestion : "",
            priority: r.priority,
            source: src,
            origin: r.origin
          });
        });
      } else {
        out.push({
          _id: continent + "-" + i,
          country: r.country,
          region: r.region || "",
          title: null,
          info: r.info,
          points: null,
          impact: r.impact,
          suggestion: r.suggestion,
          priority: r.priority,
          source: src,
          origin: r.origin
        });
      }
    });
    return out;
  }

  // Signal format (Semana 1)
  return (week.signals || [])
    .filter(s => getContinent(s.region) === continent)
    .map(s => {
      const [info, impactSynth] = splitFact(s.fact || "");
      return {
        _id: s.id,
        country: s.country,
        region: s.region || "",
        title: null,
        info: info || s.headline,
        impact: impactSynth || "",
        suggestion: s.implication,
        priority: urgencyToPriority(s.urgency),
        source: normalizeSource(s.source ? s.source.name : ""),
        origin: null,
        owner: s.owner,
        decision: s.decision,
        type: s.type
      };
    });
}

// Get countries for a continent, grouped, sorted by priority then name
function getCountries(week, continent) {
  const entries = getEntries(week, continent);
  const map = new Map();
  entries.forEach(e => {
    if (!map.has(e.country)) {
      map.set(e.country, { country: e.country, region: e.region, entries: [] });
    }
    map.get(e.country).entries.push(e);
  });
  const list = Array.from(map.values()).map(c => {
    // Highest priority across this country
    let top = "BAJA";
    c.entries.forEach(e => {
      if (PRIORITY_RANK[e.priority] < PRIORITY_RANK[top]) top = e.priority;
    });
    c.topPriority = top;
    // First entry of the highest priority (for the one-liner)
    const sorted = [...c.entries].sort((a, b) => PRIORITY_RANK[a.priority] - PRIORITY_RANK[b.priority]);
    c.lead = sorted[0];
    c.altaCount = c.entries.filter(e => e.priority === "ALTA").length;
    return c;
  });
  return list.sort((a, b) => {
    if (PRIORITY_RANK[a.topPriority] !== PRIORITY_RANK[b.topPriority])
      return PRIORITY_RANK[a.topPriority] - PRIORITY_RANK[b.topPriority];
    return a.country.localeCompare(b.country, "es");
  });
}

// Counts for a continent
function getContinentStats(week, continent) {
  const entries = getEntries(week, continent);
  const countries = new Set(entries.map(e => e.country));
  return {
    entries: entries.length,
    countries: countries.size,
    alta: entries.filter(e => e.priority === "ALTA").length,
    media: entries.filter(e => e.priority === "MEDIA").length,
    baja: entries.filter(e => e.priority === "BAJA").length
  };
}

// Existing helpers (kept for backwards compat)
function groupByCountry(signals) {
  const m = new Map();
  signals.forEach(s => {
    if (!m.has(s.country)) m.set(s.country, { country: s.country, region: s.region, signals: [] });
    m.get(s.country).signals.push(s);
  });
  return Array.from(m.values());
}
function topUrgency(signals) {
  const order = ["red", "orange", "yellow", "green"];
  for (const u of order) {
    if (signals.some(s => s.urgency === u)) return u;
  }
  return "green";
}

// ── Reusable atoms ────────────────────────────────────────────
function PriorityPill({ value, size = "md" }) {
  if (!value) return null;
  return <span className={"prio-pill prio-" + value.toLowerCase() + " prio-" + size}>{value}</span>;
}

function PriorityDot({ value }) {
  if (!value) return null;
  return <span className={"prio-dot prio-dot-" + value.toLowerCase()} aria-label={value}></span>;
}

function OriginBadge({ value }) {
  if (!value) return null;
  const tooltip = value === "PDF"
    ? "Dato extraído del sondeo IBERONEX"
    : "Información fresca investigada en la web";
  return <span className={"origin-badge origin-" + value.toLowerCase()} title={tooltip}>{value}</span>;
}

function Icon({ name, size = 16 }) {
  const sw = 1.6;
  switch (name) {
    case "search":
      return (
        <svg width={size} height={size} viewBox="0 0 16 16" fill="none" stroke="currentColor">
          <circle cx="7" cy="7" r="5" strokeWidth={sw} />
          <line x1="10.5" y1="10.5" x2="14" y2="14" strokeWidth={sw} strokeLinecap="round" />
        </svg>
      );
    case "arrow-right":
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M5 12h14M13 5l7 7-7 7" strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round" />
        </svg>
      );
    case "arrow-left":
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M19 12H5M11 5l-7 7 7 7" strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round" />
        </svg>
      );
    case "chevron-left":
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M15 18l-6-6 6-6" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round" />
        </svg>
      );
    case "chevron-right":
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M9 18l6-6-6-6" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round" />
        </svg>
      );
    case "external":
      return (
        <svg width={size} height={size} viewBox="0 0 16 16" fill="none" stroke="currentColor">
          <path d="M6 3H3v10h10v-3M9 3h4v4M13 3l-6 6" strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round" />
        </svg>
      );
    case "alert":
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M12 9v4M12 17h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round" />
        </svg>
      );
    default:
      return null;
  }
}

Object.assign(window, {
  getContinent, groupByCountry, topUrgency, Icon,
  PRIORITY_RANK, urgencyToPriority, splitFact,
  getEntries, getCountries, getContinentStats,
  PriorityPill, PriorityDot, OriginBadge
});

</script>
<script type="text/babel">
// LEVEL 1 — Vue d'ensemble: 2 grandes cartes (LATAM + ÁFRICA)
// Cada tarjeta lleva su resumen ejecutivo (solo hechos) dentro y enlaza al Nivel 2.

function HomeView({ onSelectContinent }) {
  const data = window.VEILLE_DATA;
  const continents = [
    { key: "LATAM",  label: "Latinoamérica", tag: "Región 02" },
    { key: "AFRICA", label: "África",        tag: "Región 01" }
  ];

  return (
    <div className="page">
      <div className="page-eyebrow">{data.weekLabel}</div>
      <h1 className="page-title">Brief estratégico de la semana</h1>
      <p className="page-deck">
        Selecciona una región para abrir la lista de países y consultar el detalle de cada señal.
        Los resúmenes a continuación sintetizan los hechos clave de la semana.
      </p>

      <div className="continent-cards">
        {continents.map(c => (
          <ContinentCard
            key={c.key}
            continent={c.key}
            label={c.label}
            tag={c.tag}
            week={data}
            onClick={() => onSelectContinent(c.key)}
          />
        ))}
      </div>
    </div>
  );
}

function ContinentCard({ continent, label, tag, week, onClick }) {
  const stats = useMemo(() => getContinentStats(week, continent), [week, continent]);
  const brief = (week.briefs && week.briefs[continent]) || {};

  // Solo hechos — sin alertas, oportunidades, riesgos ni headline editorial.
  const facts = (brief.facts || []).slice(0, 6);

  return (
    <article className="continent-card" onClick={onClick}
      role="button" tabIndex={0}
      onKeyDown={(e) => { if (e.key === "Enter") onClick(); }}>
      <header className="cc-head">
        <div>
          <div className="cc-tag"><span className="dot"></span>{tag}</div>
          <h2 className="cc-title">{label}</h2>
        </div>
      </header>

      <div className="cc-stats">
        <div className="cc-stat"><span className="v">{stats.countries}</span><span className="l">Países</span></div>
        <div className="cc-stat"><span className="v">{stats.entries}</span><span className="l">Señales</span></div>
      </div>

      <div className="cc-brief">
        {facts.length > 0 ? (
          <ul className="cc-brief-list">
            {facts.map((t, i) => (
              <li key={i}><span className="text">{t}</span></li>
            ))}
          </ul>
        ) : null}
      </div>

      <div className="cc-cta">
        <span className="cc-cta-text">Ver detalle por país</span>
        <span className="cc-cta-arrow"><Icon name="arrow-right" size={18} /></span>
      </div>
    </article>
  );
}

window.HomeView = HomeView;

</script>
<script type="text/babel">
// LEVEL 2 — Vue continent: liste des pays
function RegionView({ continent, onBack, onSelectCountry }) {
  const data = window.VEILLE_DATA;

  // Lista de países; el orden interno sigue la criticidad pero no se etiqueta.
  const countries = useMemo(() => getCountries(data, continent), [data, continent]);
  const stats = useMemo(() => getContinentStats(data, continent), [data, continent]);

  const label = continent === "AFRICA" ? "África" : "Latinoamérica";
  const deck = continent === "AFRICA"
    ? "Cobertura de los mercados francófonos y anglófonos en África Occidental, Central y Oriental, con vigilancia regional del Sahel."
    : "Cobertura de Andes, Cono Sur y Centroamérica y Caribe.";

  return (
    <div className="page">
      <span className="back-nav" onClick={onBack} role="button" tabIndex={0}
        onKeyDown={(e) => { if (e.key === "Enter") onBack(); }}>
        <span className="chev"><Icon name="chevron-left" size={20} /></span>
        Vue d'ensemble
      </span>

      <div className="region-hero">
        <div>
          <div className="page-eyebrow">{continent === "AFRICA" ? "Región 01" : "Región 02"}</div>
          <h1 className="page-title">{label}</h1>
          <p className="page-deck" style={{ marginBottom: 0 }}>{deck}</p>
        </div>
        <div className="region-hero-meta">
          <div className="stat"><span className="v">{stats.countries}</span><span className="l">Países</span></div>
          <div className="stat"><span className="v">{stats.entries}</span><span className="l">Señales</span></div>
        </div>
      </div>

      {countries.length === 0 ? (
        <div className="empty">Sin países registrados.</div>
      ) : (
        <div className="country-grid">
          {countries.map(c => (
            <article key={c.country} className="country-card"
              onClick={() => onSelectCountry(c.country)}
              role="button" tabIndex={0}
              onKeyDown={(e) => { if (e.key === "Enter") onSelectCountry(c.country); }}>
              <div className="cc-row1">
                <span className="ctry-region">{c.region || "—"}</span>
              </div>
              <h3 className="ctry-name">{c.country}</h3>
              <p className="ctry-lead">{(c.lead && (c.lead.title || c.lead.info)) || "—"}</p>
              <div className="cc-foot">
                <span className="cc-count">
                  <strong>{c.entries.length}</strong> entrada{c.entries.length === 1 ? "" : "s"}
                </span>
                <span className="cc-chevron"><Icon name="chevron-right" size={16} /></span>
              </div>
            </article>
          ))}
        </div>
      )}
    </div>
  );
}

window.RegionView = RegionView;

</script>
<script type="text/babel">
// LEVEL 3 — Vue pays: détail des entrées
function CountryView({ country, continent, onBack, onBackToRegion }) {
  const data = window.VEILLE_DATA;
  const allEntries = useMemo(
    () => getEntries(data, continent).filter(e => e.country === country),
    [data, continent, country]
  );

  // Orden interno por criticidad (sin etiquetarla en la UI)
  const sorted = useMemo(
    () => [...allEntries].sort((a, b) => PRIORITY_RANK[a.priority] - PRIORITY_RANK[b.priority]),
    [allEntries]
  );

  const region = sorted[0] ? sorted[0].region : "";
  const continentLabel = continent === "AFRICA" ? "África" : "Latinoamérica";

  if (sorted.length === 0) {
    return (
      <div className="page">
        <span className="back-nav" onClick={onBackToRegion}>
          <span className="chev"><Icon name="chevron-left" size={20} /></span>
          {continentLabel}
        </span>
        <div className="empty">Sin entradas registradas para este país en esta semana.</div>
      </div>
    );
  }

  return (
    <div className="page">
      <span className="back-nav" onClick={onBackToRegion} role="button" tabIndex={0}
        onKeyDown={(e) => { if (e.key === "Enter") onBackToRegion(); }}>
        <span className="chev"><Icon name="chevron-left" size={20} /></span>
        {continentLabel}
      </span>

      <div className="country-hero">
        <div>
          <h1>{country}</h1>
          <div className="region">{region}</div>
        </div>
        <div className="country-hero-stats">
          <div className="s">
            <span className="v">{sorted.length}</span>
            <span className="l">Entrada{sorted.length === 1 ? "" : "s"}</span>
          </div>
        </div>
      </div>

      <div className="entries-stack">
        {sorted.map(e => <EntryCard key={e._id} entry={e} />)}
      </div>
    </div>
  );
}

function EntryCard({ entry }) {
  const hasImpact = entry.impact && entry.impact.trim();
  const hasSuggestion = entry.suggestion && entry.suggestion.trim();
  return (
    <article className="entry-card">
      <div className="entry-fields">
        <div className="entry-field field-info">
          <span className="lbl">Información clave</span>
          {entry.points && entry.points.length ? (
            <ul className="val val-points">
              {entry.points.map((p, i) => <li key={i}>{p}</li>)}
            </ul>
          ) : (
            <div className="val">{entry.info}</div>
          )}
        </div>
        {hasImpact ? (
          <div className="entry-field field-impact">
            <span className="lbl">Impacto para Iberonex</span>
            <div className="val">{entry.impact}</div>
          </div>
        ) : null}
        {hasSuggestion ? (
          <div className="entry-field field-suggestion">
            <span className="lbl">Sugerencia estratégica</span>
            <div className="val">{entry.suggestion}</div>
          </div>
        ) : null}
      </div>

      {entry.source ? (
        <footer className="entry-foot">
          <div className="left">
            <span className="source">Fuente · {entry.source}</span>
          </div>
        </footer>
      ) : null}
    </article>
  );
}

window.CountryView = CountryView;

</script>
<script type="text/babel">
// App principal — routing por hash, navegación uniforme entre semanas.
// Niveles: home (vue d'ensemble) → region (lista pays) → country (detalle)

// ── Week selector — collapsible vertical list (Apple-style popover) ─────
function WeekSelector({ weeks, value, onChange }) {
  const [open, setOpen] = useState(false);
  const rootRef = useRef(null);

  // Orden cronológico (de la más antigua a la más reciente) según la fecha de publicación.
  const ordered = useMemo(() => [...weeks].sort((a, b) =>
    String(a.publishedAt || "").localeCompare(String(b.publishedAt || "")) || (a.weekNumber || 0) - (b.weekNumber || 0)
  ), [weeks]);
  const current = ordered.find(w => w.key === value) || ordered[0];

  useEffect(() => {
    if (!open) return;
    function onDocClick(e) {
      if (rootRef.current && !rootRef.current.contains(e.target)) setOpen(false);
    }
    function onKey(e) { if (e.key === "Escape") setOpen(false); }
    document.addEventListener("mousedown", onDocClick);
    document.addEventListener("keydown", onKey);
    return () => {
      document.removeEventListener("mousedown", onDocClick);
      document.removeEventListener("keydown", onKey);
    };
  }, [open]);

  function pick(key) {
    setOpen(false);
    if (key !== value) onChange(key);
  }

  return (
    <div className="week-nav" ref={rootRef}>
      <button
        className={"week-nav-trigger" + (open ? " is-open" : "")}
        onClick={() => setOpen(o => !o)}
        aria-haspopup="listbox"
        aria-expanded={open}>
        <span className="wnt-label">{current.label}</span>
        <span className="wnt-range">{current.range}</span>
        <span className="wnt-chevron"><Icon name="chevron-right" size={13} /></span>
      </button>
      <div className={"week-nav-panel" + (open ? " is-open" : "")} role="listbox">
        {ordered.map(w => (
          <button
            key={w.key}
            role="option"
            aria-selected={w.key === value}
            className={"week-nav-item" + (w.key === value ? " is-active" : "")}
            onClick={() => pick(w.key)}>
            <span className="wni-dot" />
            <span className="wni-text">
              <span className="wni-label">{w.label}</span>
              <span className="wni-range">{w.range}</span>
            </span>
          </button>
        ))}
      </div>
    </div>
  );
}

function App() {
  const weeks = window.VEILLE_WEEKS || [window.VEILLE_DATA];

  const [weekKey, setWeekKey] = useState(() => {
    try {
      const saved = localStorage.getItem("iberonex.weekKey.v6");
      if (saved && weeks.some(w => w.key === saved)) return saved;
    } catch {}
    return weeks[0].key; // weeks[0] = más reciente
  });

  // Sincroniza el global con la semana seleccionada
  const data = useMemo(() => {
    const w = weeks.find(x => x.key === weekKey) || weeks[0];
    window.VEILLE_DATA = w;
    return w;
  }, [weekKey, weeks]);

  useEffect(() => {
    try { localStorage.setItem("iberonex.weekKey.v6", weekKey); } catch {}
  }, [weekKey]);

  // Hash routing: #/  ·  #/africa  ·  #/africa/senegal
  const [route, setRoute] = useState(() => parseHash(window.location.hash));

  useEffect(() => {
    function onHashChange() {
      setRoute(parseHash(window.location.hash));
      window.scrollTo({ top: 0, behavior: "instant" });
    }
    window.addEventListener("hashchange", onHashChange);
    return () => window.removeEventListener("hashchange", onHashChange);
  }, []);

  function parseHash(hash) {
    const clean = (hash || "").replace(/^#\/?/, "");
    if (!clean) return { view: "home" };
    const parts = clean.split("/").map(decodeURIComponent);
    if (parts[0] === "africa" || parts[0] === "latam") {
      const continent = parts[0] === "africa" ? "AFRICA" : "LATAM";
      if (parts[1]) return { view: "country", continent, country: parts[1] };
      return { view: "region", continent };
    }
    return { view: "home" };
  }

  function navigate(routeStr) { window.location.hash = routeStr; }
  function goHome() { navigate("/"); }
  function goRegion(continent) { navigate("/" + (continent === "AFRICA" ? "africa" : "latam")); }
  function goCountry(continent, country) {
    const slug = continent === "AFRICA" ? "africa" : "latam";
    navigate("/" + slug + "/" + encodeURIComponent(country));
  }

  function changeWeek(newKey) {
    if (newKey === weekKey) return;
    setWeekKey(newKey);
    // Volver al inicio al cambiar de semana (los países pueden no coincidir)
    if (route.view !== "home") window.location.hash = "";
  }

  // ── Búsqueda global ─────────────────────────────────────────
  const [search, setSearch] = useState("");
  const searchResults = useMemo(() => {
    if (!search || !search.trim()) return null;
    const q = search.trim().toLowerCase();
    const all = [...getEntries(data, "AFRICA"), ...getEntries(data, "LATAM")];
    const matches = all.filter(e =>
      e.country.toLowerCase().includes(q) ||
      (e.info || "").toLowerCase().includes(q) ||
      (e.impact || "").toLowerCase().includes(q) ||
      (e.suggestion || "").toLowerCase().includes(q) ||
      (e.title || "").toLowerCase().includes(q)
    );
    const byCountry = new Map();
    matches.forEach(e => {
      if (!byCountry.has(e.country)) {
        const cont = getContinent(e.region) || "LATAM";
        byCountry.set(e.country, { country: e.country, region: e.region, continent: cont, count: 0, topPriority: "BAJA" });
      }
      const c = byCountry.get(e.country);
      c.count++;
      if (PRIORITY_RANK[e.priority] < PRIORITY_RANK[c.topPriority]) c.topPriority = e.priority;
    });
    return Array.from(byCountry.values()).sort((a, b) =>
      PRIORITY_RANK[a.topPriority] - PRIORITY_RANK[b.topPriority] || a.country.localeCompare(b.country, "es")
    );
  }, [search, data]);

  function renderMain() {
    if (search && search.trim() && searchResults) {
      return (
        <div className="page">
          <span className="back-nav" onClick={() => setSearch("")} role="button" tabIndex={0}>
            <span className="chev"><Icon name="chevron-left" size={20} /></span>
            Limpiar búsqueda
          </span>
          <div className="page-eyebrow">Resultados</div>
          <h1 className="page-title">"{search}"</h1>
          <p className="page-deck">
            {searchResults.length} país{searchResults.length === 1 ? "" : "es"} con coincidencias en esta semana.
          </p>
          {searchResults.length === 0 ? (
            <div className="empty">Sin coincidencias. Prueba con otro término.</div>
          ) : (
            <div className="country-grid">
              {searchResults.map(c => (
                <article key={c.country} className="country-card"
                  onClick={() => { setSearch(""); goCountry(c.continent, c.country); }}
                  role="button" tabIndex={0}>
                  <div className="cc-row1">
                    <span className="ctry-region">{c.region || "—"}</span>
                  </div>
                  <h3 className="ctry-name">{c.country}</h3>
                  <p className="ctry-lead">
                    {c.count} coincidencia{c.count === 1 ? "" : "s"} en esta semana.
                  </p>
                  <div className="cc-foot">
                    <span className="cc-count">Ir al detalle</span>
                    <span className="cc-chevron"><Icon name="chevron-right" size={16} /></span>
                  </div>
                </article>
              ))}
            </div>
          )}
        </div>
      );
    }

    if (route.view === "country") {
      return (
        <CountryView
          country={route.country}
          continent={route.continent}
          onBack={goHome}
          onBackToRegion={() => goRegion(route.continent)}
        />
      );
    }
    if (route.view === "region") {
      return (
        <RegionView
          continent={route.continent}
          onBack={goHome}
          onSelectCountry={(c) => goCountry(route.continent, c)}
        />
      );
    }
    return <HomeView onSelectContinent={goRegion} />;
  }

  const dateFmt = useMemo(() => {
    try {
      return new Date(data.publishedAt).toLocaleDateString("es-ES", { day: "2-digit", month: "long", year: "numeric" });
    } catch { return data.publishedAt; }
  }, [data.publishedAt]);

  return (
    <>
      <header className="topbar">
        <div className="topbar-brand" onClick={goHome}>
          <div className="mark">I</div>
          <div>
            <div className="name">Iberonex</div>
          </div>
          <div className="sub">Informe semanal</div>
        </div>
        <div className="topbar-search">
          <span className="icon"><Icon name="search" size={14} /></span>
          <input
            type="text"
            placeholder="Buscar país, señal, palabra clave…"
            value={search}
            onChange={e => setSearch(e.target.value)}
          />
        </div>
        <div className="topbar-right">
          <WeekSelector weeks={weeks} value={weekKey} onChange={changeWeek} />
        </div>
      </header>

      <main>{renderMain()}</main>

      <footer className="foot">
        <span>© 2026 Iberonex · Informe Semanal</span>
        <span>Confidencial · Uso interno · {dateFmt}</span>
      </footer>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
